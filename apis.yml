position: Consuming
kind: contract
access: 3rd-Party
apis:
  - aid: factory-ai:droid-sdk
    name: Factory Droid SDK (TypeScript)
    description: TypeScript SDK for building, invoking, and orchestrating Droids. Public source on GitHub at Factory-AI/droid-sdk-typescript.
    tags:
      - SDK
      - TypeScript
      - Droids
      - Agents
    properties:
      - url: https://docs.factory.ai/
        type: Documentation
      - url: https://github.com/Factory-AI/droid-sdk-typescript
        type: SourceCode
  - aid: factory-ai:droid-cli
    name: Factory Droid CLI
    description: Terminal-based interface for running Droids interactively or via Droid Exec for non-interactive CI/CD workflows. Installed via curl install script from app.factory.ai/cli.
    tags:
      - CLI
      - Droids
      - Automation
    properties:
      - url: https://docs.factory.ai/cli
        type: Documentation
      - url: https://app.factory.ai/cli
        type: Install
  - aid: factory-ai:droid-action
    name: Factory Droid GitHub Action
    description: Official GitHub Action for invoking Droids inside CI pipelines for automated code review, PR generation, and other agentic tasks.
    tags:
      - GitHub Actions
      - CI/CD
      - Droids
    properties:
      - url: https://github.com/Factory-AI/droid-action
        type: SourceCode
