aid: factory-ai
name: Factory
description: Factory is an agent-native software development platform whose Droids act as autonomous AI engineers that plan, execute, and maintain code work across CLI, desktop app, IDE plugins, and cloud. The product is B2B sales-led with a public Droid SDK (TypeScript), Droid Exec for CI/CD, a plugin marketplace, and MCP support. No public REST API surface is documented as of May 2026 - integration happens through the Droid CLI, SDK, and Droid GitHub Action.
image: https://factory.ai/og-image.png
tags:
  - AI
  - Agents
  - Autonomous
  - Developer Tools
  - Software Engineering
  - Code Generation
  - DevOps
created: '2026-05-23'
modified: '2026-05-23'
